<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | ElevateU</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded shadow-md w-96">
    <h2 class="text-2xl font-bold text-blue-600 mb-6 text-center">Login</h2>

    <form id="loginForm">
      <select id="role" class="w-full mb-4 px-4 py-2 border rounded" required>
        <option value="student">Student</option>
        <option value="management">Management</option>
      </select>
      <input id="username" type="email" placeholder="Email" class="w-full mb-4 px-4 py-2 border rounded" required />
      <input id="password" type="password" placeholder="Password" class="w-full mb-4 px-4 py-2 border rounded" required />
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Login</button>
    </form>

    <p class="text-sm text-center mt-4 text-gray-600">
      Don’t have an account?
      <a href="alumni_signup.html" class="text-blue-500 hover:underline">Register</a>
    </p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const role = document.getElementById("role").value;
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("http://localhost:5000/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ role, username, password })
        });

        const result = await response.json();

        if (response.ok) {
          alert("Login successful!");
          // Redirect based on role
          if (role === "student") {
            window.location.href = "student-dashboard.html";
          } else {
            window.location.href = "management-dashboard.html";
          }
        } else {
          alert(result.error || "Login failed.");
        }
      } catch (err) {
        alert("Server error. Please try again later.");
        console.error(err);
      }
    });
  </script>
</body>
</html>
