<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stutify - Attendance Management</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-flex">
            <div class="navbar-left">
                <span class="navbar-logo">🎓</span>
                <a href="index.html" class="site-title">Stutify</a>
            </div>
            <div class="navbar-right">
                <a href="#" class="nav-link">Home</a>
                <a href="#" class="nav-link">About</a>
                <a href="#" class="nav-link">Contact</a>
            </div>
        </div>
    </nav>
    <main class="dashboard-main">
        <a href="student-dashboard.html" class="back-link">&larr; Back to Dashboard</a>
        <header class="dashboard-header">
            <h1>Attendance Management</h1>
            <p>Track your attendance records and daily participation.</p>
        </header>
        <section class="stats-row">
            <div class="stat-card stat-card-primary">
                <div class="stat-title">Overall Attendance</div>
                <div class="stat-value">91%</div>
                <div class="stat-desc">This semester</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Days Attended</div>
                <div class="stat-value">102</div>
                <div class="stat-desc">Out of 112 days</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Days Absent</div>
                <div class="stat-value">10</div>
                <div class="stat-desc">This semester</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Today's Live Attendance</div>
                <div class="stat-value" style="color:var(--primary-blue);font-weight:700;">5/6</div>
                <div class="stat-desc">Classes attended so far today</div>
            </div>
        </section>
    </main>
</body>
</html>
